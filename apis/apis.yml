# Three keyless, unauthenticated APIs, specs VENDORED next to this file:
# Open-Meteo's OpenAPI sits behind an authenticated endpoint and the USGS
# publishes none, so a hand-curated pin is the only stable contract available.
#
# Each spec is deliberately NARROW — only the operations the producers, the
# skill and the Planet Pulse app actually call.
#
# NO `auth:` and NO `token-env:` anywhere: every source is open. The realm
# works the moment it is installed, with nothing to configure.

# Current air quality and UV for a coordinate pair. Open-Meteo serves each
# product from its own host (air-quality-api.…), hence its own namespace.
- url: open-meteo-air-quality.json
  name: open_meteo_air
  type: openapi
  auth: none
  operation-ids:
    - airQuality

# Place name → coordinates, worldwide. This is what lets the realm own its
# places: a PlanetPlace is resolved once, here, when it is added, and stored
# with its coordinates so every join afterwards is a lookup, not a guess.
- url: open-meteo-geocoding.json
  name: open_meteo_geo
  type: openapi
  auth: none
  operation-ids:
    - searchPlaces

# Earthquakes: a radius search around a coordinate pair, and the curated
# significant-quakes feed for the global pulse line.
- url: usgs-earthquakes.json
  name: usgs
  type: openapi
  auth: none
  operation-ids:
    - quakesNear
    - significantQuakes
